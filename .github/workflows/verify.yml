name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: han_menu_test
          POSTGRES_USER: han_menu
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U han_menu -d han_menu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/han_menu_test
      TEST_DB_USERNAME: han_menu
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./scripts/verify.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verification-reports
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
            target/failsafe-reports/
            target/spring-modulith-docs/
