spring:
  autoconfigure:
    # 身份认证由项目安全链处理，关闭无用的默认账号及其随机密码日志。
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: han-menu
  datasource:
    # 开发连接从环境读取；密码不提供默认值，避免误用固定凭证。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/han_menu}
    username: ${DB_USERNAME:han_menu}
    password: ${DB_PASSWORD}
  jpa:
    # 禁止在控制器序列化期间隐式访问数据库；实体结构由 Flyway 建立，Hibernate 只校验。
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    # 全新接口严格拒绝未定义字段，避免客户端拼错字段或试图批量赋值。
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 1s
      timeout: 1s
  threads:
    # 使用 JDK 的虚拟线程支持；业务代码仍须明确事务和异步执行边界。
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      # 工程统一处理 RFC 9457 扩展字段，避免默认 Advice 与模块 Advice 竞争。
      enabled: false
  modulith:
    runtime:
      # 启动时再次检查模块边界，避免仅依赖开发者主动运行测试。
      verification-enabled: true
    events:
      # 当前按单实例开发配置；业务监听器实现时必须支持重复投递。
      republish-outstanding-events-on-restart: true
      # 事件登记用于可靠投递，消费完成后删除；它不是业务审计记录。
      completion-mode: delete
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
han-menu:
  catalog:
    cache-prefix: "han-menu:catalog:"
    storage:
      endpoint: ${RUSTFS_ENDPOINT:http://127.0.0.1:9000}
      public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:${RUSTFS_ENDPOINT:http://127.0.0.1:9000}}
      region: ${RUSTFS_REGION:us-east-1}
      access-key: ${RUSTFS_ACCESS_KEY}
      secret-key: ${RUSTFS_SECRET_KEY}
      bucket: ${RUSTFS_BUCKET:han-menu}
      key-prefix: catalog/
  identity:
    session-ttl: PT8H
    login-max-attempts: 10
    login-max-ip-attempts: 50
    login-window: PT1M
    redis-key-prefix: "han-menu:identity:login:"
    bootstrap-enabled: ${IDENTITY_BOOTSTRAP_ENABLED:true}
    bootstrap-username: ${IDENTITY_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
springdoc:
  swagger-ui:
    persist-authorization: false
  paths-to-match: /api/v1/**
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    # 数据库厂商错误可能带用户名等拒绝值，HTTP 层统一转换为安全的错误分类。
    org.hibernate.orm.jdbc.error: "OFF"
