spring:
  application:
    name: han-menu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/han_menu}
    username: ${DB_USERNAME:han_menu}
    password: ${DB_PASSWORD}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  modulith:
    runtime:
      verification-enabled: true
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: delete
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
