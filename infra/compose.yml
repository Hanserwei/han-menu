# 本机开发中间件，与 PVE 上的 Hannote 实例和数据完全独立。
services:
  postgres:
    image: docker.io/library/postgres:18.6
    container_name: han-menu-postgres
    restart: unless-stopped
    shm_size: 128m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请先运行 scripts/middleware.py up}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      # PostgreSQL 18 的版本目录位于该父目录之下，不能沿用旧版 /data 挂载方式。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: docker.io/library/redis:8.10.1-alpine
    container_name: han-menu-redis
    restart: unless-stopped
    mem_limit: 512m
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请先运行 scripts/middleware.py up}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../.local/redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    container_name: han-menu-rustfs
    restart: unless-stopped
    mem_limit: 2g
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?请先运行 scripts/middleware.py up}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?请先运行 scripts/middleware.py up}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:9000/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
    name: han-menu-postgres-data
  redis_data:
    name: han-menu-redis-data
  rustfs_data:
    name: han-menu-rustfs-data
